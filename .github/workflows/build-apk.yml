name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fahfile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Repositori ekspor Google AI Studio tidak menyertakan ./gradlew dan gradle-wrapper.jar,
      # hanya gradle/wrapper/gradle-wrapper.properties (Gradle 9.3.1).
      # Siapkan Gradle 9.3.1 otomatis jika ./gradlew belum ada di repositori.
      - name: Set up Gradle (When Wrapper Script Is Absent)
        if: hashFiles('gradlew') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "Menyiapkan environment Android SDK..."
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_HOME/licenses"

          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            echo "Lisensi Android SDK berhasil disetujui via sdkmanager."
          else
            echo "::warning::sdkmanager tidak ditemukan di $ANDROID_HOME/cmdline-tools; mengandalkan lisensi atau komponen SDK yang sudah tersedia."
          fi

      - name: Prepare .env and Debug Keystore
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set +x
          echo "Memeriksa file konfigurasi wajib (.env dan debug.keystore)..."

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "File .env dibuat dari .env.example"
            else
              touch .env
              echo "File .env kosong dibuat"
            fi
          fi

          if [ -n "${RESEND_API_KEY:-}" ]; then
            grep -v '^RESEND_API_KEY=' .env > .env.tmp || true
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> .env.tmp
            mv .env.tmp .env
            echo "RESEND_API_KEY diterapkan dari GitHub Secrets tanpa menampilkan nilainya."
          fi

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "debug.keystore berhasil didekodekan dari debug.keystore.base64"
            else
              echo "debug.keystore.base64 tidak ditemukan; membuat debug.keystore sementara dengan keytool..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "debug.keystore berhasil dibuat"
            fi
          fi

      - name: Prepare Gradle Command
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Menggunakan Gradle Wrapper (./gradlew)."
          elif command -v gradle >/dev/null 2>&1; then
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "File ./gradlew tidak ditemukan; menggunakan Gradle CLI sistem (sesuai gradle-wrapper.properties 9.3.1)."
          else
            echo "::error::Tidak ditemukan ./gradlew maupun perintah gradle."
            exit 1
          fi

      - name: Build Debug APK with Gradle
        run: |
          echo "Memulai proses kompilasi APK AGRI SIGNAL (:app:assembleDebug)..."
          "$GRADLE_CMD" :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Pandroid.builder.sdkDownload=true

      - name: Collect APK Files
        run: |
          echo "Mengumpulkan file APK hasil build..."
          mkdir -p build-apks

          find app/build/outputs/apk \
            -name "*.apk" \
            -type f \
            -exec cp -v {} build-apks/ \;

          APK_COUNT=$(find build-apks -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Tidak ada file APK yang ditemukan setelah :app:assembleDebug!"
            exit 1
          fi

          echo "Ditemukan $APK_COUNT file APK:"
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fahfile-debug-apk
          path: build-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print Build Diagnostics on Failure
        if: failure()
        run: |
          echo "=============================================="
          echo "BUILD GAGAL - DETAIL DIAGNOSTIK"
          echo "=============================================="
          echo "Versi Java:"
          java -version || true
          echo "----------------------------------------------"
          echo "Versi Gradle:"
          if [ -n "${GRADLE_CMD:-}" ]; then
            "$GRADLE_CMD" --version || true
          elif [ -f "./gradlew" ]; then
            ./gradlew --version || true
          elif command -v gradle >/dev/null 2>&1; then
            gradle --version || true
          fi
          echo "----------------------------------------------"
          echo "Status Keberadaan File Konfigurasi (tanpa isi rahasia):"
          test -f ".env" && echo ".env: tersedia" || echo ".env: tidak ada"
          test -f "debug.keystore" && echo "debug.keystore: tersedia" || echo "debug.keystore: tidak ada"
          test -f "app/google-services.json" && echo "app/google-services.json: tersedia" || echo "app/google-services.json: tidak ada"
          echo "----------------------------------------------"
          echo "Daftar File Direktori Root:"
          ls -la
          echo "----------------------------------------------"
          echo "Daftar File Direktori app/:"
          ls -la app/ || true
          echo "=============================================="
